<section class="page-banner">
  <div class="container">
    <h1>Our Services</h1>
    <p>Care for the skin conditions that matter most to you.</p>
  </div>
</section>

<section class="section">
  <div class="container service-list">
    @for (s of services; track s.title) {
      <article class="service-row">
        <img class="rounded" [src]="s.image" [alt]="s.title" />
        <div>
          <h2>{{ s.title }}</h2>
          <p>{{ s.summary }}</p>
          <ul>
            @for (p of s.points; track p) { <li>{{ p }}</li> }
          </ul>
          <a class="btn" routerLink="/book">Book Now</a>
        </div>
      </article>
    }
  </div>
</section>
